[package]
name = "gistwarden-wasm"
version = "0.1.0"
edition = "2024"
description = "High-performance Rust WASM module for Gistwarden"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
totp-rs = { version = "5.6.0", default-features = false }
hmac = "0.12.1"
sha1 = "0.10.6"
data-encoding = "2.8.0"
url = "2.5.4"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
sha2 = "0.10.8"
ssh-key = { version = "0.6.7", default-features = false, features = ["ed25519", "rsa"] }
pkcs1 = { version = "0.7.5", default-features = false, features = ["pem"] }
rsa = { version = "0.9.10", default-features = false, features = ["pem"] }
getrandom = { version = "0.2.17", default-features = false, features = ["js"] }
ciborium = { version = "0.2", default-features = false }
coset = "0.3"
aes-gcm = "0.10"
flate2 = { version = "1.0", default-features = false, features = ["miniz_oxide"] }
rand = { version = "0.8", default-features = false, features = ["std", "std_rng", "getrandom"] }
regex = { version = "1.10", default-features = false, features = ["std", "perf", "unicode"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
serde-wasm-bindgen = "0.6.5"
addr = "0.15"
rqrr = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
csv = { version = "1.3", default-features = false }
zxcvbn = "3.1"
uuid = { version = "1.16", default-features = false, features = ["v4", "js"] }
chrono = { version = "0.4.39", default-features = false, features = ["wasmbind", "clock", "alloc", "serde"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
