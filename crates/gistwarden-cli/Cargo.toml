[package]
name = "gistwarden-cli"
version = "0.1.0"
edition = "2024"
description = "High-performance Rust Native AST CLI Linter & Auditor for Gistwarden"

[dependencies]
oxc_allocator = "0.48"
oxc_ast = "0.48"
oxc_parser = "0.48"
oxc_span = "0.48"
oxc_syntax = "0.48"
rayon = "1.10"
walkdir = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
